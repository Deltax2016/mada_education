[project]
name = "mada-api"
version = "0.1.0"
description = "Mada Education API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "httpx>=0.27",
    "greenlet>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
